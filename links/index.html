:root{

.sparks{position:absolute;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.spark{position:absolute;bottom:-12px;width:3px;height:3px;border-radius:50%;

  <script>
    /* Selo aberto/fechado dinâmico
       Almoço: seg–sex 11:30–14:30  |  Hamburgueria: todos os dias 17:00–00:00 */
    (function(){
      var badge=document.getElementById('badge'),
          status=badge&&badge.querySelector('.status'),
          hours=document.getElementById('hours');
      if(!badge||!status||!hours) return;
      function update(){
        var now=new Date(), day=now.getDay(), t=now.getHours()*60+now.getMinutes();
        var weekday=day>=1&&day<=5;
        var isLunch=weekday && t>=690 && t<870;   // 11:30–14:30
        var isDinner=t>=1020;                      // 17:00–00:00
        var isOpen=isLunch||isDinner;
        if(isOpen){
          badge.classList.remove('is-closed');
          status.textContent='Aberto agora';
          hours.textContent='fecha às '+(isLunch?'14h30':'00h');
        }else{
          badge.classList.add('is-closed');
          status.textContent='Fechado';
          var next=(weekday && t<690)?'11h30':'17h';
          hours.textContent='abre às '+next;
        }
        badge.setAttribute('aria-label', (isOpen?'Aberto agora':'Fechado')+' — almoço seg a sex 11h30 às 14h30, hamburgueria todos os dias 17h às 00h');
      }
      update(); setInterval(update, 60000);
    })();

    (function(){
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      // faíscas
      var sp=document.getElementById('sparks'), N=window.innerWidth<420?20:28;
      for(var i=0;i<N;i++){var s=document.createElement('span');s.className='spark';var z=2+Math.random()*3;
        s.style.left=(Math.random()*100)+'%';s.style.width=z+'px';s.style.height=z+'px';
        s.style.setProperty('--drift',(Math.random()*60-30)+'px');
        s.style.animationDuration=(6+Math.random()*7)+'s';s.style.animationDelay=(-Math.random()*12)+'s';
        s.style.opacity=(0.4+Math.random()*0.5).toFixed(2);sp.appendChild(s);}
      // chamas
      var fl=document.getElementById('flames'), M=window.innerWidth<420?11:15;
      for(var j=0;j<M;j++){var f=document.createElement('span');f.className='flame';
        var w=60+Math.random()*90, h=w*(1.4+Math.random()*0.9);
        f.style.width=w+'px';f.style.height=h+'px';f.style.left=(j/M*100+(Math.random()*8-4))+'%';
        f.style.marginLeft=(-w/2)+'px';f.style.animationDuration=(2.4+Math.random()*2.4)+'s';
        f.style.animationDelay=(-Math.random()*3)+'s';f.style.opacity=(0.5+Math.random()*0.4).toFixed(2);fl.appendChild(f);}
    })();
  </script>

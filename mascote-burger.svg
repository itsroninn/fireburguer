<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 370" width="320" height="370" role="img" aria-label="Mascote hambúrguer cozinheiro da Fire Burger">
  <!-- ============================================================
       MASCOTE FIRE BURGER — hambúrguer cozinheiro (original)
       Espátula + frigideira com ovo. Loop perfeito ~2.4s, fundo transparente.
       ============================================================ -->
  <defs>
    <radialGradient id="bShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff7a18" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f3a83e"/>
      <stop offset="100%" stop-color="#dd8624"/>
    </linearGradient>
    <linearGradient id="bunBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e89329"/>
      <stop offset="100%" stop-color="#cf7a1c"/>
    </linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#55565c"/>
      <stop offset="100%" stop-color="#2c2d31"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#eef1f5"/>
      <stop offset="55%" stop-color="#c6ccd4"/>
      <stop offset="100%" stop-color="#9aa1ab"/>
    </linearGradient>
  </defs>

  <style>
    .mascot { transform-box:fill-box; transform-origin:50% 100%; animation:bob 2.4s ease-in-out infinite; }
    .spat   { transform-box:fill-box; transform-origin:60% 95%;  animation:wave 2.4s ease-in-out infinite; }
    .panArm { transform-box:fill-box; transform-origin:30% 95%;  animation:panTilt 2.4s ease-in-out infinite; }
    .eyes   { transform-box:fill-box; transform-origin:50% 50%;  animation:blink 2.4s ease-in-out infinite; }
    .shadow { transform-box:fill-box; transform-origin:50% 50%;  animation:breathe 2.4s ease-in-out infinite; }

    @keyframes bob { 0%,100%{transform:translateY(8px) scale(1.03,.97);}
                     45%    {transform:translateY(-2px) scale(.99,1.01);}
                     55%    {transform:translateY(0)   scale(1,1);} }
    @keyframes wave   { 0%,100%{transform:rotate(8deg);} 50%{transform:rotate(-9deg);} }
    @keyframes panTilt{ 0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(3deg);} }
    @keyframes blink  { 0%,88%,100%{transform:scaleY(1);} 92%{transform:scaleY(.08);} 96%{transform:scaleY(1);} }
    @keyframes breathe{ 0%,100%{transform:scale(.92);opacity:.55;} 50%{transform:scale(1);opacity:.85;} }

    @media (prefers-reduced-motion:reduce){ .mascot,.spat,.panArm,.eyes,.shadow{animation:none;} }
  </style>

  <!-- sombra suave âmbar -->
  <ellipse class="shadow" cx="160" cy="350" rx="96" ry="17" fill="url(#bShadow)"/>

  <g class="mascot" stroke="#3a220f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== BRAÇO ESQUERDO + ESPÁTULA ===== -->
    <g class="spat">
      <path d="M96 268 C72 276 60 286 64 300" fill="none" stroke-width="13"/>
      <circle cx="64" cy="302" r="12" fill="#f0a040"/>
      <rect x="60" y="232" width="9" height="60" rx="4" fill="#7a3b1a"/>            <!-- cabo -->
      <rect x="46" y="196" width="38" height="42" rx="9" fill="url(#blade)"/>       <!-- pá -->
      <line x1="57" y1="204" x2="57" y2="230" stroke="#9aa1ab" stroke-width="3"/>
      <line x1="65" y1="204" x2="65" y2="230" stroke="#9aa1ab" stroke-width="3"/>
      <line x1="73" y1="204" x2="73" y2="230" stroke="#9aa1ab" stroke-width="3"/>
    </g>

    <!-- ===== BRAÇO DIREITO + FRIGIDEIRA COM OVO ===== -->
    <g class="panArm">
      <path d="M224 268 C250 274 264 262 268 246" fill="none" stroke-width="13"/>
      <circle cx="270" cy="244" r="12" fill="#f0a040"/>
      <rect x="250" y="206" width="40" height="11" rx="5" transform="rotate(28 270 211)" fill="#2c2d31"/> <!-- cabo -->
      <circle cx="252" cy="178" r="34" fill="url(#pan)"/>                            <!-- panela -->
      <circle cx="252" cy="178" r="24" fill="#3b3c41" stroke="#222" stroke-width="3"/>
      <!-- ovo frito -->
      <path d="M238 176 q-4 -14 10 -14 q12 -2 12 10 q10 2 6 12 q2 12 -12 10 q-10 6 -16 -4 q-12 -2 0 -14 z"
            fill="#fff" stroke="#e7e2d4" stroke-width="2"/>
      <circle cx="250" cy="176" r="6.5" fill="#ffb324" stroke="#e88f12" stroke-width="2"/>
    </g>

    <!-- ===== PERNAS ===== -->
    <path d="M142 318 v22" fill="none" stroke-width="13"/>
    <path d="M178 318 v22" fill="none" stroke-width="13"/>
    <ellipse cx="138" cy="344" rx="15" ry="9" fill="#f0a040"/>
    <ellipse cx="182" cy="344" rx="15" ry="9" fill="#f0a040"/>

    <!-- ===== CORPO HAMBÚRGUER ===== -->
    <!-- pão de baixo -->
    <path d="M70 286 q0 26 24 26 h132 q24 0 24 -26 v-6 q0 -10 -12 -10 H82 q-12 0 -12 10 z" fill="url(#bunBot)"/>
    <!-- camada inferior (alface) -->
    <path d="M64 270 q12 -14 24 0 q12 14 24 0 q12 -14 24 0 q12 14 24 0 q12 -14 24 0 q12 14 24 0 q12 -14 24 0
             v18 H64 z" fill="#5fb83a"/>
    <!-- carne -->
    <rect x="66" y="250" width="188" height="26" rx="11" fill="#7a4a26"/>
    <!-- queijo escorrendo -->
    <path d="M70 236 h180 v10 q-14 16 -28 0 q-14 16 -28 0 q-14 16 -28 0 q-14 16 -28 0 q-14 16 -28 0 q-8 8 -12 0 z"
          fill="#ffc12e"/>
    <!-- carne 2 -->
    <rect x="66" y="216" width="188" height="24" rx="11" fill="#8a3326"/>
    <!-- alface topo -->
    <path d="M64 210 q12 -14 24 0 q12 14 24 0 q12 -14 24 0 q12 14 24 0 q12 -14 24 0 q12 14 24 0 q12 -14 24 0
             v8 H64 z" fill="#5fb83a"/>

    <!-- pão de cima (rosto) -->
    <path d="M60 214 q-2 -96 100 -96 q102 0 100 96 z" fill="url(#bun)"/>
    <!-- gergelim -->
    <g stroke="none" fill="#fff3d6">
      <ellipse cx="120" cy="150" rx="5" ry="2.4" transform="rotate(-25 120 150)"/>
      <ellipse cx="160" cy="138" rx="5" ry="2.4" transform="rotate(15 160 138)"/>
      <ellipse cx="200" cy="152" rx="5" ry="2.4" transform="rotate(35 200 152)"/>
      <ellipse cx="140" cy="172" rx="5" ry="2.4" transform="rotate(10 140 172)"/>
      <ellipse cx="185" cy="178" rx="5" ry="2.4" transform="rotate(-15 185 178)"/>
      <ellipse cx="100" cy="180" rx="5" ry="2.4" transform="rotate(20 100 180)"/>
      <ellipse cx="220" cy="180" rx="5" ry="2.4" transform="rotate(-20 220 180)"/>
    </g>

    <!-- ===== ROSTO ===== -->
    <g>
      <circle cx="120" cy="196" r="11" fill="#ff9a5c" stroke="none" opacity=".85"/>
      <circle cx="200" cy="196" r="11" fill="#ff9a5c" stroke="none" opacity=".85"/>
      <g class="eyes">
        <ellipse cx="135" cy="180" rx="9" ry="11" fill="#fff"/>
        <ellipse cx="185" cy="180" rx="9" ry="11" fill="#fff"/>
        <circle cx="137" cy="183" r="5" fill="#3a220f" stroke="none"/>
        <circle cx="187" cy="183" r="5" fill="#3a220f" stroke="none"/>
        <circle cx="139" cy="181" r="1.7" fill="#fff" stroke="none"/>
        <circle cx="189" cy="181" r="1.7" fill="#fff" stroke="none"/>
      </g>
      <!-- sorriso -->
      <path d="M138 200 q22 24 44 0 q-22 10 -44 0 z" fill="#7a2b22" stroke-width="5"/>
    </g>

    <!-- ===== CHAPÉU DE COZINHEIRO ===== -->
    <g>
      <rect x="118" y="112" width="84" height="22" rx="9" fill="#f6f3ec"/>
      <path d="M122 116 C104 110 102 78 126 76 C130 56 172 54 180 74
               C204 68 220 96 202 116 Z" fill="#fff"/>
    </g>

  </g>
</svg>
